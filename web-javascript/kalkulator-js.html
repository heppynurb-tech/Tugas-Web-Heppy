<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALKULATOR</title>
</head>
<body>
    <h1>KALKULATOR</h1>

    <script type="text/javascript">
        let angka1 = prompt("Masukkan Angka Pertama: ");
        let angka2 = prompt("Masukkan Angka Kedua: ");

        // menjumlahkan kedua angka 
        let penjumlahan = parseFloat(angka1) + parseFloat(angka2);

        // menmpilkan hasil penjumlahan 
        document.write("Hasil Penjumlahan: " + penjumlahan);
    </script>
</body>
</html>
